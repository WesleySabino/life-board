<title id="title">Life Board overview with synthetic tasks</title><desc id="desc">Illustrative example with five tasks across the real Inbox, Next, Doing, Waiting, and Done columns. A lamp comparison records checked options and a next step in notes; a hike waits for input; a completed checklist records a verified result. Progress and blocker conventions use existing notes and labels.</desc>
