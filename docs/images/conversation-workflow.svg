<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Conversation to task and progress workflow</title><desc id="desc">Synthetic workflow: ask your dot in OpenAI Codex, use the connected Life Board MCP plugin to list, create, and revision-check task updates, and view verified progress using Doing, Waiting, and Done. A private deployment uses sign-in, user-scoped D1 storage, and revision checks. Separately, an explicit calendar refresh request lets a connected Google Calendar tool fetch a complete window and save a Life Board snapshot; the board does not automatically sync calendars, run jobs, grant approvals, or embed a chat panel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#709789" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1440" height="990" rx="0" fill="#f3f7f2" stroke="none" stroke-width="1" /><rect x="64" y="42" width="147" height="29" rx="7" fill="#dfece4" stroke="none" stroke-width="1" /><text x="74" y="62" font-size="16" fill="#246858" font-weight="600" >LIFE BOARD</text><text x="1376" y="64" font-size="16" fill="#526963" font-weight="500" text-anchor="end">Illustrative example • synthetic tasks</text><text x="64" y="127" font-size="43" fill="#20332f" font-weight="700" >From a conversation to visible progress</text><text x="64" y="171" font-size="23" fill="#526963" font-weight="400" >Work with your dot in OpenAI Codex, then return to your board</text><rect x="64" y="216" width="408" height="313" rx="16" fill="#fff" stroke="#d6e3dc" stroke-width="1" /><rect x="86" y="237" width="43" height="29" rx="7" fill="#eaf1eb" stroke="none" stroke-width="1" /><text x="96" y="257" font-size="17" fill="#246858" font-weight="600" >01</text><text x="86" y="299" font-size="22" fill="#20332f" font-weight="650" >Ask in your conversation</text><rect x="516" y="216" width="408" height="313" rx="16" fill="#fff" stroke="#d6e3dc" stroke-width="1" /><rect x="538" y="237" width="43" height="29" rx="7" fill="#eef2f8" stroke="none" stroke-width="1" /><text x="548" y="257" font-size="17" fill="#246858" font-weight="600" >02</text><text x="592" y="259" font-size="16" fill="#526963" font-weight="500">MCP task tools</text><text x="538" y="299" font-size="22" fill="#20332f" font-weight="650" >Use the connected plugin</text><rect x="968" y="216" width="408" height="313" rx="16" fill="#fff" stroke="#d6e3dc" stroke-width="1" /><rect x="990" y="237" width="43" height="29" rx="7" fill="#edf4ed" stroke="none" stroke-width="1" /><text x="1000" y="257" font-size="17" fill="#246858" font-weight="600" >03</text><text x="990" y="299" font-size="22" fill="#20332f" font-weight="650" >See the latest task state</text><text x="86" y="341" font-size="21" fill="#20332f" font-weight="400" >“Compare desk lamps and</text><text x="86" y="372" font-size="21" fill="#20332f" font-weight="400" >track the checked options</text><text x="86" y="403" font-size="21" fill="#20332f" font-weight="400" >and next step on my board.”</text><text x="86" y="457" font-size="17" fill="#526963" font-weight="400" >You choose the work and scope</text><text x="86" y="484" font-size="17" fill="#526963" font-weight="400" >Approvals stay in your conversation</text><text x="538" y="341" font-size="18" fill="#526963" font-weight="400" >Read current tasks and revisions</text><text x="538" y="370" font-size="18" fill="#526963" font-weight="400" >Create a card or update its notes</text><text x="538" y="399" font-size="18" fill="#526963" font-weight="400" >Move it as verified work progresses</text><rect x="538" y="451" width="117" height="29" rx="7" fill="#edf2f8" stroke="none" stroke-width="1" /><text x="548" y="471" font-size="16" fill="#47677e" font-weight="600" >list_tasks</text><rect x="664" y="451" width="132" height="29" rx="7" fill="#edf2f8" stroke="none" stroke-width="1" /><text x="674" y="471" font-size="16" fill="#47677e" font-weight="600" >create_task</text><rect x="538" y="491" width="140" height="29" rx="7" fill="#edf2f8" stroke="none" stroke-width="1" /><text x="548" y="511" font-size="16" fill="#47677e" font-weight="600" >update_task</text><text x="690" y="512" font-size="16" fill="#526963" font-weight="400" >revision-checked</text><rect x="990" y="329" width="80" height="29" rx="7" fill="#eee8f6" stroke="none" stroke-width="1" /><text x="1000" y="349" font-size="16" fill="#78569f" font-weight="600" >Doing</text><text x="1081" y="350" font-size="18" fill="#20332f" font-weight="400" >Checked 3 options</text><rect x="990" y="380" width="96" height="29" rx="7" fill="#fcf0d9" stroke="none" stroke-width="1" /><text x="1000" y="400" font-size="16" fill="#966118" font-weight="600" >Waiting</text><text x="1097" y="401" font-size="18" fill="#20332f" font-weight="400" >Needs your input</text><rect x="990" y="431" width="77" height="29" rx="7" fill="#e3f1e8" stroke="none" stroke-width="1" /><text x="1000" y="451" font-size="16" fill="#256c51" font-weight="600" >Done</text><text x="1078" y="452" font-size="18" fill="#20332f" font-weight="400" >Result verified</text><text x="990" y="501" font-size="17" fill="#526963" font-weight="400" >Notes retain evidence and a next step</text><path d="M478 367H506" fill="none" stroke="#709789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M930 367H958" fill="none" stroke="#709789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="555" width="1312" height="118" rx="15" fill="#e6eee7" stroke="none" stroke-width="1" /><path d="M92 598v-11a9 9 0 0 1 18 0v11M89 598h24v22H89Z" fill="none" stroke="#246858" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="132" y="599" font-size="22" fill="#20332f" font-weight="650" >Keep your deployment private</text><text x="132" y="631" font-size="18" fill="#526963" font-weight="400" >Sign-in and user-scoped D1 storage protect access; revision checks protect edits</text><text x="1354" y="599" font-size="18" fill="#246858" font-weight="600" text-anchor="end">Open-source code ≠ shared personal data</text><text x="64" y="729" font-size="25" fill="#20332f" font-weight="650" >Calendar context, when you ask</text><text x="64" y="761" font-size="18" fill="#526963" font-weight="400" >A separately connected calendar tool reads the selected sources; Life Board stores a saved snapshot</text><rect x="64" y="789" width="368" height="94" rx="12" fill="#fff" stroke="#d6e3dc" stroke-width="1" /><text x="82" y="825" font-size="20" fill="#20332f" font-weight="650" >1  Request a refresh</text><text x="82" y="856" font-size="17" fill="#526963" font-weight="400" >Choose calendars and a window</text><rect x="536" y="789" width="368" height="94" rx="12" fill="#fff" stroke="#d6e3dc" stroke-width="1" /><text x="554" y="825" font-size="20" fill="#20332f" font-weight="650" >2  Read Google Calendar</text><text x="554" y="856" font-size="17" fill="#526963" font-weight="400" >Fetch and verify the complete window</text><rect x="1008" y="789" width="368" height="94" rx="12" fill="#fff" stroke="#d6e3dc" stroke-width="1" /><text x="1026" y="825" font-size="20" fill="#20332f" font-weight="650" >3  Save the snapshot</text><text x="1026" y="856" font-size="17" fill="#526963" font-weight="400" >replace_calendar_snapshot</text><path d="M446 837H519" fill="none" stroke="#709789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M918 837H991" fill="none" stroke="#709789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="64" y="922" font-size="18" fill="#526963" font-weight="400" >Calendar refresh is request-driven. Opening the board does not fetch Google Calendar</text><text x="64" y="953" font-size="18" fill="#526963" font-weight="400" >The board stores tasks and context; it does not run jobs, grant approvals, or embed a chat panel</text></g></svg>